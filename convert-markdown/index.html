<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calinawan Markdown Studio</title>
    <!-- Google Fonts for UI and Code Editor styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="app-header">
        <div class="logo-area">
            <span class="logo-icon">&lt;/&gt;</span>
            <h1>Calinawan Markdown Studio</h1>
        </div>
        <div class="actions">
            <button id="clear-btn" class="btn btn-secondary">Clear</button>
            <button id="copy-btn" class="btn btn-primary">Copy HTML</button>
        </div>
    </header>

    <main id="app-grid">
        <!-- Markdown Input Section -->
        <section class="panel">
            <div class="panel-header">
                <span class="status-dot"></span>
                <h2>Markdown Input</h2>
            </div>
            <div class="panel-body">
                <textarea id="markdown-input" spellcheck="false" placeholder="Enter your markdown here..."></textarea>
            </div>
        </section>

        <!-- HTML Output Section -->
        <section class="panel">
            <div class="panel-header">
                <span class="status-dot"></span>
                <h2>Raw HTML Output</h2>
            </div>
            <div class="panel-body">
                <pre id="html-output" class="code-view"></pre>
            </div>
        </section>

        <!-- Live Preview Section -->
        <section class="panel">
            <div class="panel-header">
                <span class="status-dot green"></span>
                <h2>HTML Preview</h2>
            </div>
            <div class="panel-body">
                <div id="preview" class="preview-view"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
